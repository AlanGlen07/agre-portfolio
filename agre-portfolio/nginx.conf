server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/rss+xml;

  # Fingerprinted build output (assets/*-[hash].js|css) never changes: cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    try_files $uri =404;
  }

  # Feeds and crawler files: short cache so new posts show up quickly.
  location ~* ^/(rss\.xml|sitemap\.xml|robots\.txt)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # Everything else is the single-page app: real files first, then index.html so
  # deep links like /blog/introducing-kidlat work on refresh. index.html itself
  # is never cached, so a new deploy is picked up immediately.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    try_files $uri $uri/ /index.html;
  }
}