server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # ---- compression ----
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # ---- security headers ----
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Optional, stricter: enable after testing in the browser console (it blocks anything not listed).
  # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://formspree.io; frame-src 'self'; object-src 'self'; base-uri 'self'; form-action 'self'" always;

  # ---- caching ----
  # NOTE: no add_header inside these locations, otherwise nginx drops the security headers above.

  # hashed build files (file name changes whenever the content changes): cache for a year
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # the page itself must always be re-checked so new deploys show up right away
  location = /index.html {
    expires -1;
  }

  # files copied as-is from /public (favicon, certificate images...)
  location ~* \.(?:png|jpe?g|webp|gif|svg|ico|woff2?)$ {
    expires 7d;
    try_files $uri =404;
  }

  # health check for Docker / your host
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # never serve hidden files
  location ~ /\. {
    deny all;
  }

  # single page app: anything else falls back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}